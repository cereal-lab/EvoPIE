services:
  updater:
    build: ./analysislayer
    volumes:
      - ${EVOPIE_DATA_DIR:-./data}:/app/data
    environment:
      - EVOPIE_DATABASE_URI=${EVOPIE_DATABASE_URI:-sqlite:////app/data/db.sqlite}
      - INIT_DB=1
    expose:
      - 5000
    env_file:
      - ./analysislayer/.env.dev
    restart: always
  web:
    build: ./evopie
    volumes:
      - ${EVOPIE_DATA_DIR:-./data}:/app/data
    environment:
      - EVOPIE_DATABASE_URI=${EVOPIE_DATABASE_URI:-sqlite:////app/data/db.sqlite}
    expose:
      - 5000
    env_file:
      - ./evopie/.env.dev
    depends_on:
      - updater      
    restart: always
  nginx:
    build: ./nginx
    ports:
      - "5000:5000"
    environment:
      - EVOPIE_NGINX_MODE=${EVOPIE_NGINX_MODE:?Set EVOPIE_NGINX_MODE to http or https}
      - EVOPIE_SERVER_NAME=${EVOPIE_SERVER_NAME:-}
      - EVOPIE_CERT_DOMAIN=${EVOPIE_CERT_DOMAIN:-}
    depends_on:
      - web
    restart: always
    volumes:
      - ${EVOPIE_CERTS_DIR:-./certs}:/etc/nginx/certs:ro