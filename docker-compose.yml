x-web-environment: &web-environment
  - EVOPIE_DATABASE_URI=${EVOPIE_DATABASE_URI:-sqlite:////app/data/db.sqlite}

x-updater-common: &updater-common
  build:
    context: ./analysislayer
    args:
      EVOPIE_GIT_REF: ${EVOPIE_GIT_REF:-master}
  environment:
    - EVOPIE_DATABASE_URI=${EVOPIE_DATABASE_URI:-sqlite:////app/data/db.sqlite}
    - INIT_DB=1
  expose:
    - 5000
  env_file:
    - ./analysislayer/.env.dev
  restart: always

x-web-common: &web-common
  build:
    context: ./evopie
    args:
      EVOPIE_GIT_REF: ${EVOPIE_GIT_REF:-master}
  environment: *web-environment
  expose:
    - 5000
  env_file:
    - ./evopie/.env.dev
  restart: always

x-nginx-common: &nginx-common
  build: ./nginx
  ports:
    - "5000:5000"
  restart: always

x-local-watch-ignore: &local-watch-ignore
  - .git/
  - __pycache__/
  - '*.pyc'
  - venv/
  - .vscode/
  - .DS_Store
  - data/
  - certs/
  - results/
  - algo/
  - figures/
  - db.log
  - Pipfile
  - Pipfile.lock
  - evopie/Dockerfile.local
  - analysislayer/Dockerfile.local

services:
  updater-local:
    <<: *updater-common
    build:
      context: .
      dockerfile: analysislayer/Dockerfile.local
    profiles:
      - local
    volumes:
      - ${EVOPIE_DATA_DIR:-./data}:/app/data
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app
          ignore: *local-watch-ignore
        - action: rebuild
          path: Pipfile
        - action: rebuild
          path: Pipfile.lock
        - action: rebuild
          path: analysislayer/Dockerfile.local

  web-local:
    <<: *web-common
    build:
      context: .
      dockerfile: evopie/Dockerfile.local
    profiles:
      - local
    ports:
      - "5000:5000"
    volumes:
      - ${EVOPIE_DATA_DIR:-./data}:/app/data
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app
          ignore: *local-watch-ignore
        - action: rebuild
          path: Pipfile
        - action: rebuild
          path: Pipfile.lock
        - action: rebuild
          path: evopie/Dockerfile.local
    depends_on:
      - updater-local

  production-config:
    image: alpine:3.20
    profiles:
      - production
    command: >
      sh -c '
        test -n "$EVOPIE_DATA_DIR" ||
          { echo "Set EVOPIE_DATA_DIR for production" >&2; exit 1; }
        test -n "$EVOPIE_SERVER_NAME" ||
          { echo "Set EVOPIE_SERVER_NAME for production" >&2; exit 1; }
        test -n "$EVOPIE_CERTS_DIR" ||
          { echo "Set EVOPIE_CERTS_DIR for production" >&2; exit 1; }
      '
    environment:
      - EVOPIE_DATA_DIR=${EVOPIE_DATA_DIR:-}
      - EVOPIE_SERVER_NAME=${EVOPIE_SERVER_NAME:-}
      - EVOPIE_CERTS_DIR=${EVOPIE_CERTS_DIR:-}

  updater-production:
    <<: *updater-common
    profiles:
      - production
    volumes:
      - ${EVOPIE_DATA_DIR:-./data}:/app/data
    depends_on:
      production-config:
        condition: service_completed_successfully

  web-production:
    <<: *web-common
    profiles:
      - production
    volumes:
      - ${EVOPIE_DATA_DIR:-./data}:/app/data
    depends_on:
      production-config:
        condition: service_completed_successfully
      updater-production:
        condition: service_started

  nginx-production:
    <<: *nginx-common
    profiles:
      - production
    environment:
      - EVOPIE_SERVER_NAME=${EVOPIE_SERVER_NAME:-}
      - EVOPIE_CERT_DOMAIN=${EVOPIE_CERT_DOMAIN:-}
      - EVOPIE_UPSTREAM=web-production:5000
    volumes:
      - ${EVOPIE_CERTS_DIR:-./certs}:/etc/nginx/certs:ro
    depends_on:
      production-config:
        condition: service_completed_successfully
      web-production:
        condition: service_started
