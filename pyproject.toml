[project]
name = "evopie"
version = "0.1.0"
requires-python = ">=3.8,<3.9"
dependencies = [
    "flask==2.0.3",
    "jinja2==3.0.3",
    "markupsafe==2.1.0",
    "sqlalchemy==1.4.31",
    "flask-sqlalchemy==2.5.1",
    "flask-login==0.5.0",
    "flask-admin==1.6.0",
    "werkzeug==2.0.3",
    "gunicorn==20.1.0",
    "plotly==5.6.0",
    "pandas==1.4.1",
    "numpy",
    "pylint==2.12.2",
    "bleach==4.1.0",
    "bleach-allowlist==1.0.3",
    "matplotlib==3.7.2",
    "dash==2.11.1",
    "dash-bootstrap-components==1.4.1",
    "dash-cytoscape==0.2.0",
    "scipy==1.10.1",
    "scikit-learn==1.2.2",
    "ipywidgets==7.0.0",
    "debugpy",
]

[dependency-groups]
dev = [
    "pylint==2.12.2",
    "rope==0.23.0",
    "autopep8==1.6.0",
